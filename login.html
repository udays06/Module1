<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkwell Log In</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;800&family=Newsreader:opsz,wght@6..72,400;500&display=swap">
<style>
body{margin:0;background:#FFFFFF;font-family:'Bricolage Grotesque',system-ui,sans-serif;color:#14172A}
a{color:inherit;text-decoration:none}
a.lnk:hover{color:#3B3FD8}
</style>
</head>
<body>
<div style="width:100%;max-width:1280px;margin:0 auto;box-sizing:border-box;min-height:760px;display:flex;flex-wrap:wrap;background:#FFFFFF;color:#14172A;font-family:'Bricolage Grotesque',system-ui,sans-serif">

<section style="flex:1 1 480px;min-width:0;position:relative;overflow:hidden;background:#3B3FD8;color:#FFFFFF;padding:48px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;gap:48px;min-height:360px">
<svg viewBox="0 0 640 760" preserveAspectRatio="xMidYMax slice" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%"><circle cx="500" cy="560" r="150" fill="#FFD66B"></circle><path d="M0 760L220 430l260 330z" fill="#14172A"></path><path d="M300 760l140-140 200 140z" fill="#E9E9FB"></path></svg>
<a href="index.html" style="position:relative;display:flex;align-items:center;gap:10px;font-weight:800;font-size:26px;letter-spacing:-0.02em">
<svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#FFFFFF"></rect><path d="M9 20c4-1 7-5 10-11-1 6-3 9-6 11-1 .7-3 .7-4 0z" fill="#3B3FD8"></path></svg>
Inkwell
</a>
<div style="position:relative;display:flex;flex-direction:column;gap:14px;max-width:440px">
<h2 style="margin:0;font-size:44px;line-height:1.05;letter-spacing:-0.03em;font-weight:800">Pick up where you left off.</h2>
<p style="margin:0;font-family:'Newsreader',Georgia,serif;font-size:20px;line-height:1.5;color:#E9E9FB">Your drafts, your readers and your notes are waiting.</p>
</div>
</section>

<section style="flex:1 1 480px;min-width:0;padding:48px;box-sizing:border-box;display:flex;align-items:center;justify-content:center">
<div style="width:100%;max-width:420px;display:flex;flex-direction:column;gap:28px">
<div style="display:flex;flex-direction:column;gap:8px">
<h1 style="margin:0;font-size:36px;line-height:1.1;letter-spacing:-0.03em;font-weight:800">Log in</h1>
<p style="margin:0;font-size:16px;color:#5A6075">Welcome back. Enter your details to continue.</p>
</div>

<form action="dashboard.html" style="display:flex;flex-direction:column;gap:20px">
<div style="display:flex;flex-direction:column;gap:8px">
<label for="login-email" style="font-size:14px;font-weight:600">Email address</label>
<input id="login-email" type="email" autocomplete="email" placeholder="you@example.com" style="height:48px;box-sizing:border-box;border-radius:12px;border:1.5px solid #D0D3E0;padding:0 16px;font:inherit;font-size:16px;color:#14172A;background:#FFFFFF">
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
<label for="login-password" style="font-size:14px;font-weight:600">Password</label>
<a class="lnk" href="login.html" style="font-size:14px;font-weight:600;color:#3B3FD8">Forgot password?</a>
</div>
<input id="login-password" type="password" autocomplete="current-password" placeholder="Enter your password" style="height:48px;box-sizing:border-box;border-radius:12px;border:1.5px solid #D0D3E0;padding:0 16px;font:inherit;font-size:16px;color:#14172A;background:#FFFFFF">
</div>
<div style="display:flex;align-items:center;gap:10px">
<input id="login-remember" type="checkbox" style="width:20px;height:20px;margin:0;accent-color:#3B3FD8">
<label for="login-remember" style="font-size:15px;color:#4A5066">Keep me signed in on this device</label>
</div>
<button type="submit" style="height:50px;border-radius:12px;border:0;background:#3B3FD8;color:#FFFFFF;font:inherit;font-weight:700;font-size:16px;cursor:pointer">Log in</button>
</form>

<div style="display:flex;align-items:center;gap:14px;color:#5A6075;font-size:14px">
<span style="flex:1 1 0;height:1px;background:#E4E6EE"></span>
<span>or</span>
<span style="flex:1 1 0;height:1px;background:#E4E6EE"></span>
</div>

<button type="button" style="height:50px;border-radius:12px;border:1.5px solid #14172A;background:#FFFFFF;color:#14172A;font:inherit;font-weight:600;font-size:16px;cursor:pointer">Continue with Google</button>

<p style="margin:0;font-size:15px;color:#4A5066;text-align:center">New to Inkwell? <a class="lnk" href="register.html" style="color:#3B3FD8;font-weight:700">Create an account</a></p>
</div>
</section>

</div>
</body>
</html>
