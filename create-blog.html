<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkwell Create Blog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;800&family=Newsreader:opsz,wght@6..72,400;500&display=swap">
<style>
body{margin:0;background:#FFFFFF;font-family:'Bricolage Grotesque',system-ui,sans-serif;color:#14172A}
a{color:inherit;text-decoration:none}
a.lnk:hover{color:#3B3FD8}
</style>
</head>
<body>
<div style="width:100%;max-width:1280px;margin:0 auto;box-sizing:border-box;min-height:1000px;background:#FFFFFF;color:#14172A;font-family:'Bricolage Grotesque',system-ui,sans-serif">

<header style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:16px 48px;border-bottom:1px solid #E4E6EE">
<a href="dashboard.html" aria-label="Back to dashboard" style="display:inline-flex;align-items:center;gap:10px;height:44px;font-weight:600;font-size:15px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
Dashboard
</a>
<a href="index.html" style="display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-0.02em">
<svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#3B3FD8"></rect><path d="M9 20c4-1 7-5 10-11-1 6-3 9-6 11-1 .7-3 .7-4 0z" fill="#FFD66B"></path></svg>
Inkwell
</a>
<span style="flex:1 1 0;min-width:0"></span>
<span style="font-size:14px;color:#5A6075">Draft · not saved yet</span>
<button type="button" style="height:44px;padding:0 20px;border-radius:999px;border:1.5px solid #14172A;background:#FFFFFF;color:#14172A;font:inherit;font-weight:600;font-size:15px;cursor:pointer">Save draft</button>
<button type="button" style="height:44px;padding:0 22px;border-radius:999px;border:0;background:#3B3FD8;color:#FFFFFF;font:inherit;font-weight:600;font-size:15px;cursor:pointer">Publish</button>
</header>

<form style="display:flex;flex-wrap:wrap;gap:40px;padding:32px 48px 64px;align-items:flex-start">

<section aria-label="Story" style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px">

<div style="display:flex;flex-direction:column;gap:8px">
<label for="post-title" style="font-size:14px;font-weight:600;color:#5A6075">Title</label>
<input id="post-title" type="text" placeholder="Give your story a title" style="border:0;border-bottom:1.5px solid #E4E6EE;outline:0;padding:6px 0 14px;font:inherit;font-size:44px;line-height:1.1;letter-spacing:-0.03em;font-weight:800;color:#14172A;background:transparent;width:100%;box-sizing:border-box">
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<label for="post-subtitle" style="font-size:14px;font-weight:600;color:#5A6075">Subtitle</label>
<input id="post-subtitle" type="text" placeholder="One line that tells readers why to keep going" style="border:0;outline:0;padding:4px 0;font-family:'Newsreader',Georgia,serif;font-size:22px;color:#14172A;background:transparent;width:100%;box-sizing:border-box">
</div>

<div role="toolbar" aria-label="Formatting" style="display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px solid #E4E6EE;border-radius:14px;background:#F4F5F9">
<button type="button" aria-label="Bold" style="width:44px;height:44px;border-radius:10px;border:0;background:transparent;font:inherit;font-weight:800;font-size:17px;cursor:pointer;color:#14172A">B</button>
<button type="button" aria-label="Italic" style="width:44px;height:44px;border-radius:10px;border:0;background:transparent;font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:19px;cursor:pointer;color:#14172A">I</button>
<button type="button" aria-label="Heading" style="width:44px;height:44px;border-radius:10px;border:0;background:transparent;font:inherit;font-weight:700;font-size:15px;cursor:pointer;color:#14172A">H2</button>
<span aria-hidden="true" style="width:1px;background:#D0D3E0;margin:8px 4px"></span>
<button type="button" aria-label="Quote" style="width:44px;height:44px;border-radius:10px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="#14172A" aria-hidden="true"><path d="M5 17v-5c0-3 1.5-5 4-6l1 1.6C8.600 8.400 8 9.500 8 11h3v6zM14 17v-5c0-3 1.500-5 4-6l1 1.600c-1.400.8-2 1.900-2 3.400h3v6z"></path></svg></button>
<button type="button" aria-label="Bulleted list" style="width:44px;height:44px;border-radius:10px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14172A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"></path></svg></button>
<button type="button" aria-label="Link" style="width:44px;height:44px;border-radius:10px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14172A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.700 0l3-3a4 4 0 0 0-5.700-5.700l-1 1M14 10a4 4 0 0 0-5.700 0l-3 3a4 4 0 0 0 5.700 5.700l1-1"></path></svg></button>
<button type="button" aria-label="Insert image" style="width:44px;height:44px;border-radius:10px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14172A" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="1.800"></circle><path d="M21 16l-5-5-8 9"></path></svg></button>
<button type="button" aria-label="Code block" style="width:44px;height:44px;border-radius:10px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"></path></svg></button>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<label for="post-body" style="font-size:14px;font-weight:600;color:#5A6075">Story</label>
<textarea id="post-body" placeholder="Tell your story..." style="min-height:420px;resize:vertical;border:1.5px solid #E4E6EE;border-radius:14px;outline:0;padding:20px;font-family:'Newsreader',Georgia,serif;font-size:20px;line-height:1.6;color:#14172A;background:#FFFFFF;width:100%;box-sizing:border-box"></textarea>
</div>
</section>

<aside aria-label="Story settings" style="flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:24px;padding:24px;border-radius:20px;background:#F4F5F9;box-sizing:border-box">
<h2 style="margin:0;font-size:15px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#5A6075">Story settings</h2>

<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:14px;font-weight:600">Cover image</span>
<button type="button" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;border-radius:14px;border:2px dashed #B9BDD0;background:#FFFFFF;color:#14172A;font:inherit;cursor:pointer;padding:16px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3B3FD8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"></path></svg>
<span style="font-weight:600;font-size:15px">Upload a cover image</span>
<span style="font-size:13px;color:#5A6075">JPG or PNG, wide format works best</span>
</button>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<label for="post-category" style="font-size:14px;font-weight:600">Category</label>
<select id="post-category" style="height:48px;box-sizing:border-box;border-radius:12px;border:1.5px solid #D0D3E0;padding:0 14px;font:inherit;font-size:16px;color:#14172A;background:#FFFFFF">
<option>Design</option>
<option>Engineering</option>
<option>Product</option>
<option>Writing</option>
<option>Life</option>
<option>Culture</option>
</select>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<label for="post-tags" style="font-size:14px;font-weight:600">Tags</label>
<input id="post-tags" type="text" placeholder="Add up to five, separated by commas" style="height:48px;box-sizing:border-box;border-radius:12px;border:1.5px solid #D0D3E0;padding:0 14px;font:inherit;font-size:16px;color:#14172A;background:#FFFFFF">
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<label for="post-excerpt" style="font-size:14px;font-weight:600">Short summary</label>
<textarea id="post-excerpt" placeholder="Shown on cards and in search results" style="min-height:96px;resize:vertical;border-radius:12px;border:1.5px solid #D0D3E0;padding:12px 14px;font:inherit;font-size:16px;line-height:1.5;color:#14172A;background:#FFFFFF;box-sizing:border-box;width:100%"></textarea>
</div>

<fieldset style="margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:10px">
<legend style="padding:0;margin-bottom:10px;font-size:14px;font-weight:600">Visibility</legend>
<div style="display:flex;align-items:center;gap:10px"><input id="vis-public" type="radio" name="visibility" checked style="width:20px;height:20px;margin:0;accent-color:#3B3FD8"><label for="vis-public" style="font-size:15px">Public, listed on the home feed</label></div>
<div style="display:flex;align-items:center;gap:10px"><input id="vis-unlisted" type="radio" name="visibility" style="width:20px;height:20px;margin:0;accent-color:#3B3FD8"><label for="vis-unlisted" style="font-size:15px">Unlisted, anyone with the link</label></div>
</fieldset>

<div style="display:flex;align-items:center;gap:10px">
<input id="allow-comments" type="checkbox" checked style="width:20px;height:20px;margin:0;accent-color:#3B3FD8">
<label for="allow-comments" style="font-size:15px">Allow comments</label>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<label for="post-schedule" style="font-size:14px;font-weight:600">Schedule for later (optional)</label>
<input id="post-schedule" type="datetime-local" style="height:48px;box-sizing:border-box;border-radius:12px;border:1.5px solid #D0D3E0;padding:0 14px;font:inherit;font-size:16px;color:#14172A;background:#FFFFFF">
</div>

<div style="display:flex;flex-wrap:wrap;gap:10px">
<button type="button" style="flex:1 1 120px;height:50px;border-radius:12px;border:1.5px solid #14172A;background:#FFFFFF;color:#14172A;font:inherit;font-weight:600;font-size:16px;cursor:pointer">Preview</button>
<a href="dashboard.html" style="flex:1 1 120px;display:inline-flex;align-items:center;justify-content:center;height:50px;border-radius:12px;background:#3B3FD8;color:#FFFFFF;font-weight:700;font-size:16px;box-sizing:border-box">Publish</a>
</div>
</aside>

</form>
</div>
</body>
</html>
